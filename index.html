<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>НРИ Стол</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--p:#18181b;--l:#3f3f46;--g:#bfa15f;--b:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#e4e4e7;font:13px 'Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
body:not(.dm) .dm{display:none!important}
button,input,select{font:inherit;background:#27272a;color:#f4f4f5;border:1px solid #52525b;border-radius:6px;padding:6px 8px;min-width:0;outline:none}
button{cursor:pointer}button:hover{background:#3f3f46}
button.on,button.gold{background:var(--g);color:#121212;border-color:var(--g);font-weight:700}
button.red{background:#7f1d1d;border-color:#991b1b}
:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.row{display:flex;gap:6px}.row>*{flex:1}
label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#a1a1aa}
label.chk{flex-direction:row;align-items:center;gap:6px;cursor:pointer}
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#121214;z-index:99}
.box{width:min(380px,92vw);background:var(--p);border:1px solid var(--g);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0 0 4px;text-align:center;color:var(--g);font-size:19px}
.box input{padding:10px;font-size:14px}.box button{padding:10px}
#list{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.gi{padding:8px 10px;border:1px solid var(--l);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;background:#111}
.gi.sel{border-color:var(--g);background:#27272a}.gi small{color:#71717a;overflow:hidden;text-overflow:ellipsis}
#vp{position:fixed;inset:0;touch-action:none;overflow:hidden;cursor:grab}
#vp.ruler,#vp.fog{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#map{position:relative;background:#27272a;box-shadow:0 0 40px #000}
#img{display:block;width:100%;height:100%;pointer-events:none}
#img:not([src]){visibility:hidden}
#map.grid::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background-image:linear-gradient(#ffffff30 1px,transparent 1px),linear-gradient(90deg,#ffffff30 1px,transparent 1px);background-size:var(--gs) var(--gs)}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#fog{z-index:5}body.dm #fog{opacity:.5}#rul{z-index:6}
#toks .tok{position:absolute;z-index:3;font-size:calc(var(--gs)*.16)}
.tok.item{z-index:2}.tok.gm{opacity:.55}
.tok .im{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;transition:transform .08s}
.tok.sel .im{filter:drop-shadow(0 0 .6em var(--b))}
.tok.turn .im{filter:drop-shadow(0 0 .8em #eab308);animation:pulse 1.4s infinite alternate}
@keyframes pulse{to{filter:drop-shadow(0 0 1.4em #fde047)}}
@media(prefers-reduced-motion:reduce){.tok.turn .im{animation:none}}
.hp{position:absolute;left:0;right:0;top:100%;margin-top:.2em;height:.6em;background:#000b;border:1px solid #000;border-radius:3px;overflow:hidden}
.hp i{display:block;height:100%;background:#22c55e}
.nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1em;white-space:nowrap;background:#0a0a0ce6;border:1px solid #52525b;border-radius:6px;padding:.1em .6em;font-weight:600}
.ac{position:absolute;left:-.4em;top:-.4em;min-width:2em;height:2em;padding:0 .3em;border-radius:99px;background:#18181b;border:.15em solid var(--g);color:#fef08a;font-weight:700;font-size:1.2em;display:flex;align-items:center;justify-content:center;z-index:4}
.st{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:1.8em;z-index:4;line-height:1}
.ac:empty,.nm:empty,.st:empty{display:none}
aside{position:fixed;top:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none;overflow-y:auto;scrollbar-width:none}
aside>section{pointer-events:auto;background:#18181bf5;border:1px solid var(--l);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:6px}
#R{right:10px;width:240px}
h4{margin:0 0 2px;color:var(--g);font-size:12px;text-align:center;border-bottom:1px solid var(--l);padding-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#log{flex:1;overflow:auto;background:#141416;border:1px solid var(--l);border-radius:4px;padding:4px 6px;min-height:80px;font-size:12px;user-select:text}
#log p{margin:0;padding:4px 0;border-bottom:1px solid #27272a;line-height:1.35}
.crit{color:#22c55e;font-weight:700}.fumble{color:#ef4444;font-weight:700}.drop{opacity:.4;text-decoration:line-through}
.tag{background:var(--g);color:#121212;font-weight:700;font-size:10px;padding:0 4px;border-radius:3px;margin-right:4px}.tag.sec{background:#a855f7;color:#fff}
#init{display:flex;flex-direction:column;gap:3px;max-height:130px;overflow:auto}
.ii{display:flex;justify-content:space-between;padding:3px 7px;border:1px solid var(--l);border-radius:4px;background:#111}
.ii.turn{border-color:#eab308;background:#eab30833}.ii b{color:var(--b)}
#pl div{display:flex;align-items:center;gap:6px;padding:1px 0}
#pl div::before{content:'';width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e}
#menu{position:fixed;z-index:70;width:240px;max-height:88vh;overflow:auto;background:#18181bfa;border:1px solid var(--b);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 25px #000c}
#mf{display:flex;flex-direction:column;gap:6px}
#stg{display:flex;flex-wrap:wrap;gap:4px}
#stg span{font-size:17px;padding:2px 6px;border:1px solid var(--l);border-radius:4px;cursor:pointer;background:#111}
#stg span.on{border-color:var(--b);background:#38bdf840}
#dist{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;background:#18181bf2;border:1px solid var(--g);border-radius:20px;padding:6px 16px;font:700 15px monospace;color:#fff;pointer-events:none}
#tg{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;padding:4px 14px}
body.nopanel aside,body.nopanel nav{display:none}
.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:999;background:#18181b;border:1px solid var(--g);padding:8px 16px;border-radius:8px;max-width:90vw}
@media(max-width:800px){#R{width:190px}aside{font-size:12px}}
#map{overflow:hidden}#img{position:absolute;max-width:none}
body:not(.dm) .tok.gm{display:none}
#L{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;background:#18181bf5;border:1px solid var(--l);border-radius:10px;padding:6px}
#L button{width:42px;height:42px;font-size:19px;padding:0}
.pop{position:fixed;left:68px;top:80px;z-index:55;width:230px;background:#18181bf5;border:1px solid var(--l);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
#ob{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:55;background:#18181bf5;border:1px solid var(--l);border-radius:8px;padding:6px 10px;display:flex;gap:6px;align-items:center;max-width:94vw}
#ob span{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tabs{display:flex;gap:4px}#tabs button{flex:1}#tabs button.on{background:var(--g);color:#121212;border-color:var(--g)}
.tab{display:flex;flex-direction:column;gap:6px}
#dg{grid-template-columns:repeat(3,1fr)}#log{flex:none;height:180px}
#bgh{position:absolute;z-index:7;background:var(--b);border:2px solid #fff;border-radius:3px;cursor:nwse-resize;touch-action:none}
#vw.on{background:var(--b);color:#000}
</style>
</head>
<body oncontextmenu="return false">

<div id="lobby">
  <div class="box" id="s-start"><h2>НРИ Стол</h2>
    <button class="gold" onclick="dmStart()">Я Мастер</button>
    <button onclick="show('s-join')">Я Игрок</button></div>
  <div class="box" id="s-games" hidden><h2>Миры Мастера</h2>
    <div id="list"></div>
    <button onclick="newGame()">+ Создать мир</button>
    <div class="row"><button onclick="renGame()">Переименовать</button><button class="red" onclick="delGame()">Удалить</button></div>
    <button class="gold" onclick="enter(sel)">Запустить стол</button></div>
  <div class="box" id="s-join" hidden><h2>Подключение</h2>
    <input id="jn" placeholder="Ваше имя" maxlength="24"><input id="jc" placeholder="Код комнаты от Мастера">
    <button class="gold" onclick="join()">Войти в мир</button>
    <button onclick="show('s-start')">Назад</button></div>
</div>

<div id="app" hidden>
  <div id="vp"><div id="world"><div id="map" class="grid"><img id="img" alt=""><canvas id="fog"></canvas><canvas id="rul"></canvas><div id="toks"></div></div><div id="bgh" hidden></div></div></div>
  <button id="tg" onclick="document.body.classList.toggle('nopanel')" aria-label="Панели">☰</button>

  <nav id="L">
    <button class="dm" onclick="$('tokfile').click()" title="Добавить токен">➕</button>
    <button id="t-select" class="on" onclick="tool('select')" title="Выбор и перемещение">🖐</button>
    <button id="t-ruler" onclick="tool('ruler')" title="Линейка и области">📏</button>
    <button id="t-fog" class="dm" onclick="tool('fog')" title="Туман войны">🌫</button>
    <button id="t-bg" class="dm" onclick="tool('bg')" title="Двигать и растягивать фон">🖼</button>
    <button onclick="$('map').classList.toggle('grid')" title="Сетка">▦</button>
    <button class="dm" onclick="$('mp').hidden=!$('mp').hidden" title="Карты и размер поля">🗺</button>
    <button id="vw" onclick="asPlayer()" title="Посмотреть как игрок" hidden>👁</button>
    <input type="file" id="mapfile" accept="image/*" hidden><input type="file" id="tokfile" accept="image/*" hidden>
  </nav>
  <input id="zoom" type="range" min=".08" max="2.5" step=".02" value=".5" style="position:fixed;left:10px;bottom:14px;width:120px;z-index:50" aria-label="Масштаб">
  <section id="mp" class="pop dm" hidden>
    <h4 id="mapname">Карта</h4>
    <select id="mapsel"></select>
    <div class="row"><button onclick="$('mapfile').click()">+ Карта</button><button onclick="mapOp('ren')" title="Переименовать">✏️</button><button class="red" onclick="mapOp('del')" title="Удалить">🗑</button></div>
    <button onclick="R('meta/playerMap').set(S.mid)">🚩 Игроки сюда</button>
    <label>Размер поля (клеток: ширина × высота)</label>
    <div class="row"><input id="bw" type="number" min="5" max="200"><input id="bh" type="number" min="5" max="200"></div>
  </section>
  <div id="ob" hidden>
    <span id="o-ruler" hidden><select id="rshape"><option value="line">Линия</option><option value="sphere">Сфера</option><option value="cone">Конус</option></select><input id="rcol" type="color" value="#bfa15f" aria-label="Цвет"><input id="rangle" type="number" value="60" style="width:60px" title="Угол конуса °"><label class="chk"><input type="checkbox" id="rsnap"> к сетке</label></span>
    <span id="o-fog" hidden><select id="fogact"><option value="f">Накрыть</option><option value="c">Открыть</option></select><button onclick="fogOp('undo')">↶</button><button onclick="fogOp('fill')">Закрыть всё</button><button onclick="fogOp('clear')">Открыть всё</button></span>
    <span id="o-bg" hidden>Тяните фон мышью, за синий уголок — размер (Alt — без сохранения пропорций) <button onclick="bgFit()">Растянуть на поле</button></span>
  </div>
  <aside id="R">
    <section>
      <div id="tabs"><button class="on" data-t="t1">🎲 Кубы</button><button data-t="t2">⚔ Бой</button><button data-t="t3">👥 <span id="pc">0</span></button></div>
      <div id="t1" class="tab">
        <div class="row"><label>Кол-во<input id="dc" type="number" value="1" min="1" max="50"></label><label>Бонус<input id="db" type="number" value="0"></label></div>
        <div class="grid" id="dg"></div>
        <input id="fx" placeholder="2d6+4, 2d20kh1 — Enter">
        <label class="chk"><input type="checkbox" id="secret"> 🔒 Втайне</label>
        <div id="log"></div>
      </div>
      <div id="t2" class="tab" hidden><div id="init"></div><button class="gold dm" onclick="nextTurn()">Следующий ход ➔</button></div>
      <div id="t3" class="tab" hidden><div id="pl"></div><button onclick="invite()">🔗 Пригласить</button></div>
    </section>
  </aside>

  <div id="menu" hidden>
    <div id="mf"></div>
    <label class="dm">Слой<select id="f-layer"><option value="token">Токен</option><option value="item">Предмет</option><option value="gm">GM (скрыт от игроков)</option></select></label>
    <label class="dm">Управляет<select id="f-own"></select></label>
    <label class="chk dm"><input type="checkbox" id="f-showHp"> Показывать HP игрокам</label>
    <div id="stg"></div>
    <button class="red dm" onclick="killTok()">❌ Удалить токен</button>
  </div>
  <div id="dist" hidden></div>
</div>

<script>
/* ВСТАВЬТЕ СВОЙ КОНФИГ из Firebase Console → Project settings. Включите Auth: Email/Password и Anonymous. */
const CFG={apiKey:"AIzaSyCE434mAjYrQUhCLtGMK3GbHwuyf5pLQPY",authDomain:"stol-beta.firebaseapp.com",databaseURL:"https://stol-beta-default-rtdb.europe-west1.firebasedatabase.app",projectId:"stol-beta",appId:"1:426597944863:web:719472e2fb4acd27e70f2a"};
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.database(),$=id=>document.getElementById(id);
const S={cam:{x:0,y:0,z:.5},maps:{},assets:{},toks:{},els:{},players:{},off:[],tool:'select',games:{},meta:{},rt:0};
let sel=null,drag=null;const D={},P=new Map();
const G=()=>db.ref('games/'+S.gid),R=p=>db.ref(`games/${S.gid}/${p}`);
const ST={dead:'💀',poison:'🤢',stun:'💫',fire:'🔥',ice:'❄️',shock:'⚡',shield:'🛡️',invis:'👁️',sleep:'💤'};
const FLD=[['n','Имя','text'],['hp','HP','number'],['mhp','Макс. HP','number'],['ac','КЗ','text'],['ini','Инициатива','number'],['sz','Размер (клеток)','number',.5,1],['rot','Поворот °','number',15]];
const dm=()=>S.isDM&&!S.asPlayer,can=t=>dm()||t.own==='all'||t.own===S.uid;
const path=t=>`${t.layer==='gm'?'gm':'tokens'}/${S.mid}/${t.id}`;
const nick=()=>($('nick').value.trim()||'Игрок').slice(0,24);
const rnd=n=>{const a=new Uint32Array(1),lim=4294967296-4294967296%n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n+1};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)}
function show(id){document.querySelectorAll('.box').forEach(b=>b.hidden=b.id!==id)}
const ID=()=>db.ref().push().key;

/* ===== ЛОББИ ===== */
async function dmStart(){try{if(!auth.currentUser)await auth.signInAnonymously();S.uid=auth.currentUser.uid;await loadGames();show('s-games')}catch(x){toast('Ошибка входа: '+x.message)}}
async function loadGames(){S.games=(await db.ref(`users/${S.uid}/games`).once('value')).val()||{};renderGames()}
function renderGames(){const l=$('list');l.textContent='';
  const ids=Object.keys(S.games);if(!ids.length)l.textContent='Миров пока нет. Создайте первый.';
  ids.forEach(id=>{const d=document.createElement('div'),a=document.createElement('b'),c=document.createElement('small');
    d.className='gi'+(id===sel?' sel':'');a.textContent=S.games[id];c.textContent='Код: '+id;d.append(a,c);d.onclick=()=>{sel=id;renderGames()};l.append(d)})}
async function newGame(){const n=(prompt('Название мира:')||'').trim().slice(0,60);if(!n)return;
  const id=db.ref('games').push().key,mid=ID();
  await db.ref(`games/${id}/meta`).set({name:n,owner:S.uid,playerMap:mid});
  await db.ref().update({[`games/${id}/maps/${mid}`]:{name:'Локация 1',w:2100,h:1400,grid:70},[`users/${S.uid}/games/${id}`]:n});
  S.games[id]=n;sel=id;renderGames()}
async function renGame(){if(!sel)return;const n=(prompt('Новое название:',S.games[sel])||'').trim().slice(0,60);if(!n)return;
  await db.ref().update({[`games/${sel}/meta/name`]:n,[`users/${S.uid}/games/${sel}`]:n});S.games[sel]=n;renderGames()}
async function delGame(){if(!sel||!confirm(`Удалить мир «${S.games[sel]}» навсегда?`))return;
  await db.ref(`games/${sel}`).remove();await db.ref(`users/${S.uid}/games/${sel}`).remove();delete S.games[sel];sel=null;renderGames()}
async function join(){const id=$('jc').value.trim();if(!$('jn').value.trim())return toast('Введите ваше имя');if(!id)return toast('Введите код комнаты');
  try{if(!auth.currentUser)await auth.signInAnonymously();S.uid=auth.currentUser.uid;
    if(!(await db.ref(`games/${id}/meta`).once('value')).exists())return toast('Комната не найдена. Проверьте код.');
    enter(id)}catch(x){toast('Не удалось подключиться: '+x.message)}}

/* ===== ВХОД В ИГРУ ===== */
async function enter(id){
  if(!id)return toast('Сначала выберите мир');
  S.gid=id;const m=(await R('meta').once('value')).val();if(!m)return toast('Мир не найден');
  S.meta=m;S.isDM=m.owner===S.uid;const nm=(($('s-join').hidden?'':$('jn').value)||'').trim().slice(0,24);S.name=nm||(S.isDM?'Мастер':'Игрок');
  document.body.classList.toggle('dm',S.isDM);$('lobby').hidden=true;$('app').hidden=false;$('vw').hidden=!S.isDM;
  const me=R('players/'+S.uid);me.set(S.name);me.onDisconnect().remove();
  R('players').on('value',s=>{S.players=s.val()||{};renderPlayers()});
  R('meta').on('value',s=>{const v=s.val();if(!v)return;S.meta=v;if(!S.isDM&&S.mid!==v.playerMap)openMap(v.playerMap);Object.values(S.toks).forEach(renderTok);renderMaps();renderInit()});
  R('maps').on('value',s=>{S.maps=s.val()||{};
    if(S.want&&S.maps[S.want]){const w=S.want;S.want=null;openMap(w)}
    else if(!S.mid||!S.maps[S.mid]){const k=S.maps[S.meta.playerMap]?S.meta.playerMap:Object.keys(S.maps)[0];if(k)openMap(k)}
    else applyMap();
    renderMaps()});
  R('assets').on('child_added',s=>{S.assets[s.key]=s.val();refreshImgs();Object.values(S.toks).forEach(renderTok)});
  R('log').limitToLast(50).on('child_added',s=>addLog(s.val()));
  if(S.isDM)R('gm/log').on('child_added',s=>addLog(s.val()));
  R('ruler').on('value',s=>{const r=s.val();if(r&&r.u!==S.uid)drawRuler(r);else if(!r&&!S.ruling)clearRuler()});
}

/* ===== КАРТЫ ===== */
function openMap(mid){
  if(!S.maps[mid])return;if(S.mid===mid)return applyMap();
  S.off.forEach(f=>f());S.off=[];S.mid=mid;S.toks={};S.els={};sel=null;$('toks').textContent='';closeMenu();
  const watch=b=>{const r=R(`${b}/${mid}`),up=s=>upTok(s.val());
    r.on('child_added',up);r.on('child_changed',up);r.on('child_removed',s=>rmTok(s.key,b));S.off.push(()=>r.off())};
  watch('tokens');if(S.isDM)watch('gm');
  applyMap();center();renderMaps();renderInit()}
function applyMap(){const m=S.maps[S.mid];if(!m)return;
  const mp=$('map');mp.style.width=m.w+'px';mp.style.height=m.h+'px';mp.style.setProperty('--gs',m.grid+'px');
  for(const c of [$('fog'),$('rul')]){if(c.width!==m.w)c.width=m.w;if(c.height!==m.h)c.height=m.h}
  refreshImgs();drawFog();applyBg();if(document.activeElement!==$('bw'))$('bw').value=Math.round(m.w/m.grid);if(document.activeElement!==$('bh'))$('bh').value=Math.round(m.h/m.grid);
  $('mapname').textContent=m.name;Object.values(S.toks).forEach(renderTok)}
function refreshImgs(){const m=S.maps[S.mid],im=$('img');if(!m)return;
  if(m.img&&S.assets[m.img]){if(im.dataset.a!==m.img){im.src=S.assets[m.img];im.dataset.a=m.img}}
  else if(!m.img){im.removeAttribute('src');delete im.dataset.a}}
function renderMaps(){const s=$('mapsel');if(!S.isDM)return;s.textContent='';
  Object.entries(S.maps).forEach(([k,m])=>{const o=document.createElement('option');o.value=k;o.textContent=(k===S.meta.playerMap?'🚩 ':'')+m.name;o.selected=k===S.mid;s.append(o)})}

function parseRoll(f){f=f.toLowerCase().replace(/\s/g,'');if(!/^[+-]?[^+-]+([+-][^+-]+)*$/.test(f))return null;let tot=0;const terms=[];

      if(m[3]){const idx=r.map((_,i)=>i).sort((i,j)=>m[3]==='h'?r[j]-r[i]:r[i]-r[j]);k=r.map(()=>0);idx.slice(0,+m[4]).forEach(i=>k[i]=1)}
      tot+=sg*r.reduce((a,v,i)=>a+(k[i]?v:0),0);terms.push({s:sg,f:b,fc,r,k})}
    else if(/^\d+$/.test(b)){tot+=sg*+b;terms.push({s:sg,v:+b})}else return null}
  return{tot,terms}}

  const l={u:S.name,f,t:r.terms,r:r.tot,s:$('secret').checked?1:0,d:S.isDM?1:0,ts:firebase.database.ServerValue.TIMESTAMP};
