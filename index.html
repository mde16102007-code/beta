<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архивный НРИ Стол</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
</head>
<body oncontextmenu="return false;">

    <!-- ЛОББИ -->
    <div id="lobby-screen">
        <div class="lobby-box" id="lobby-step-1">
            <h2>Добро пожаловать</h2>
            <input type="text" id="player-nickname" placeholder="Ваше Имя" value="Игрок">
            <button onclick="switchLobbyStep('dm-auth')">Я Мастер (DM)</button>
            <button onclick="switchLobbyStep('player-join')" style="background: #3f3f46; color: white;">Я Игрок</button>
        </div>

        <div class="lobby-box" id="lobby-dm-auth" style="display:none;">
            <h2>Аккаунт Мастера</h2>
            <input type="text" id="dm-auth-user" placeholder="Логин Мастера">
            <input type="password" id="dm-auth-pass" placeholder="Пароль">
            <button onclick="handleDmAuth()" style="background:#22c55e; color:white;">Войти</button>
            <button onclick="switchLobbyStep('1')" style="background:transparent; color:#a1a1aa; font-size:11px;">Назад</button>
        </div>

        <div class="lobby-box" id="lobby-dm-dashboard" style="display:none; width: 400px;">
            <h2 id="dm-dashboard-title">Миры Мастера</h2>
            <div class="games-list" id="games-list-container"></div>
            <button onclick="openGameEditor(false)" style="background:#0f766e;">+ Создать мир</button>
            <div style="display:flex; gap: 5px;">
                <button onclick="openGameEditor(true)" style="background:#374151;">Изменить</button>
                <button id="btn-delete-game-dashboard" onclick="deleteGameClick()" style="background:#7f1d1d;">Удалить</button>
            </div>
            <hr style="border:0; border-top:1px solid #3f3f46; margin: 5px 0;">
            <button onclick="launchGameDM()" style="background:#bfa15f; color:#121212; font-size:16px; padding:12px;">Запустить Стол 🚀</button>
        </div>

        <div class="lobby-box" id="lobby-dm-edit" style="display:none;">
            <h2>Настройка Мира</h2>
            <input type="text" id="edit-game-name" placeholder="Название игры">
            <button onclick="saveGameChanges()" style="background:#22c55e; color:white;">Сохранить</button>
            <button onclick="switchLobbyStep('dm-dashboard')" style="background:#3f3f46; color:white;">Отмена</button>
        </div>

        <div class="lobby-box" id="lobby-player-join" style="display:none;">
            <h2>Подключение к игре</h2>
            <label style="font-size: 11px; color: #a1a1aa;">Ваше имя в игре:</label>
            <input type="text" id="lobby-join-nickname" placeholder="Ваше Имя" value="Игрок">
            <label style="font-size: 11px; color: #a1a1aa; margin-top: 5px;">Код партии:</label>
            <input type="text" id="player-game-code" placeholder="Код комнаты (от Мастера)">
            <button onclick="launchGamePlayer()">Войти в мир</button>
            <button onclick="switchLobbyStep('1')" style="background:transparent; color:#a1a1aa; font-size:11px;">Назад</button>
        </div>
    </div>

    <!-- ВЫДВИЖНАЯ ПАНЕЛЬ КАРТ -->
    <div id="maps-drawer-container" class="dm-only">
        <div id="maps-drawer-toggle" onclick="toggleMapsDrawer()">
            <span>🗺️ Карта: <span id="current-map-title-display">...</span></span>
            <span id="drawer-arrow-icon">▼</span>
        </div>
        <div id="maps-drawer-content">
            <div id="maps-cards-list" style="display: flex; gap: 10px;"></div>
            <input type="file" id="map-library-upload" accept="image/*" style="display:none;">
            <div class="add-map-card dm-only" onclick="document.getElementById('map-library-upload').click()">
                <span style="font-size: 24px;">+</span>
                <span style="font-size: 11px; margin-top: 4px;">Добавить карту</span>
            </div>
        </div>
    </div>

    <!-- ЛЕВАЯ БОКОВАЯ ПАНЕЛЬ -->
    <div class="left-sidebar">
        <div class="sidebar-block">
            <h4>Инструменты</h4>
            
            <div class="dm-only" style="margin-bottom: 6px;">
                <input type="file" id="token-upload" accept="image/*" style="display:none;">
                <button style="background: #22c55e; color: black; width: 100%; font-weight: bold;" onclick="document.getElementById('token-upload').click()">+ Добавить Токен</button>
            </div>

            <div class="dm-only" style="margin-bottom: 6px;">
                <label style="font-size:10px; color:#aaa; display:block; margin-bottom:2px;">Активный слой:</label>
                <select id="active-layer-select" onchange="changeActiveLayer()" style="width:100%;">
                    <option value="token">Токены</option>
                    <option value="item">Предметы</option>
                    <option value="gm">GM (Скрыто)</option>
                </select>
            </div>

            <div class="tools-grid">
                <button id="btn-mode-ruler" onclick="toggleRulerMode()">📏 Линейка</button>
                <button id="btn-mode-fog" class="dm-only" onclick="toggleFogMode()">🌫️ Туман войны</button>
            </div>
            
            <div id="ruler-options" style="display:none; flex-direction:column; gap:4px; margin-top:5px; border-top:1px solid #3f3f46; padding-top:5px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-size:10px; color:#aaa;">Цвет линейки:</label>
                    <input type="color" id="ruler-color" value="#bfa15f" style="width:30px; height:24px; padding:0; border:none;">
                </div>
                <label style="font-size:11px; color:#bfa15f;">Шаблон АОЕ:</label>
                <select id="ruler-shape" onchange="updateRulerShapeUI()">
                    <option value="line">📏 Линия</option>
                    <option value="sphere">🔮 Сфера (Радиус)</option>
                    <option value="cone">📐 Конус (Сектор)</option>
                </select>
                <div id="ruler-angle-container" style="display:none; justify-content:space-between; align-items:center; margin-top:3px;">
                    <label style="font-size:10px; color:#aaa;">Угол °:</label>
                    <input type="number" id="ruler-angle" value="60" style="width:55px; padding:2px;">
                </div>
            </div>

            <div id="fog-options" class="dm-only" style="display:none; flex-direction:column; gap:4px; margin-top:5px; border-top:1px solid #3f3f46; padding-top:5px;">
                <label style="font-size:11px; color:#38bdf8;">Режим тумана:</label>
                <select id="fog-action">
                    <option value="hide">⬛ Накрыть туманом</option>
                    <option value="reveal">⬜ Открыть карту</option>
                </select>
                <button onclick="clearAllFog()" style="background:#ef4444; color:#fff; margin-top:3px;">🧹 Сбросить весь туман</button>
                <button onclick="fillAllFog()" style="background:#3b82f6; color:#fff;">⬛ Покрыть всю карту</button>
            </div>
        </div>

        <div class="sidebar-block">
            <h4>🎲 Броски кубов</h4>
            <div class="dice-container">
                <div style="display:flex; gap:5px; justify-content:space-between;">
                    <label style="font-size: 10px;">К-во: <input type="number" id="dice-count" value="1" class="no-spinner" style="width:32px; padding:2px;"></label>
                    <label style="font-size: 10px;">Бонус: <input type="number" id="dice-bonus" value="0" class="no-spinner" style="width:35px; padding:2px;"></label>
                </div>
                <div class="dice-grid">
                    <button onclick="rollDice(4)">d4</button>
                    <button onclick="rollDice(6)">d6</button>
                    <button onclick="rollDice(8)">d8</button>
                    <button onclick="rollDice(10)">d10</button>
                    <button onclick="rollDice(12)">d12</button>
                    <button onclick="rollDice(20)" style="color:#bfa15f;">d20</button>
                </div>
            </div>
        </div>

        <div id="initiative-tracker">
            <h4 onclick="toggleInitiativeTracker()">
                <span>⚔️ Инициатива</span>
                <span id="initiative-arrow">▼</span>
            </h4>
            <div class="initiative-list" id="initiative-list-container"></div>
            <button id="btn-next-turn" onclick="nextTurn()" style="background:#bfa15f; color:#121212; font-weight:bold; margin-top:4px; width:100%; padding:5px; font-size:11px;">Следующий ход ➔</button>
        </div>
    </div>

    <!-- ПРАВАЯ БОКОВАЯ ПАНЕЛЬ -->
    <div class="right-sidebar">
        <div class="sidebar-block">
            <h4>Масштаб</h4>
            <div class="zoom-block-content">
                <input type="range" id="zoomRangeSide" class="zoom-slider-horiz" min="0.08" max="2.2" step="0.02" value="0.55" oninput="changeZoomSlider(this.value)">
                <span id="zoomValueSide" style="font-size:11px; color:#bfa15f; white-space: nowrap;">100%</span>
            </div>
        </div>

        <div class="sidebar-block" id="players-sidebar-block">
            <h4 onclick="togglePlayersPanel()" style="cursor:pointer; margin:0; display:flex; justify-content:space-between; width:100%;">
                <span>👥 Игроки (<span id="online-count">0</span>)</span>
                <span id="players-arrow">▼</span>
            </h4>
            <div id="players-online-list" style="display:none; margin-top:5px; max-height:120px; overflow-y:auto; flex-direction:column; gap:4px;"></div>
            <button id="invite-btn" style="margin-top:7px; width:100%; background:#38bdf8; color:#121212; font-size:11px; font-weight:bold; padding:6px; border:none; border-radius:4px; cursor:pointer;" onclick="copyInviteLink()">🔗 Пригласить друзей</button>
        </div>

        <div class="sidebar-block" style="flex: 1; min-height: 180px; display:flex; flex-direction:column;">
            <h4>📜 Лог кубов <span style="cursor:pointer; color:#ef4444; float:right;" class="dm-only" onclick="clearDiceLog()">🧹</span></h4>
            <div class="dice-log" id="dice-log-box" style="flex: 1; overflow-y: auto;"></div>
            
            <div style="display:flex; flex-direction:column; gap:4px; margin-top:6px; border-top:1px solid #3f3f46; padding-top:6px;">
                <input type="text" id="dice-formula-input" placeholder="Формула (2d6+4, Enter для броска)" style="font-size:11px; padding:4px;">
                <label style="font-size: 10px; color: #a855f7; display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <input type="checkbox" id="secret-roll-toggle"> 🔒 Бросок втайне
                </label>
            </div>
        </div>
    </div>

    <!-- ИНДИКАТОР ЛИНЕЙКИ -->
    <div id="ruler-distance-indicator">
        <span id="ruler-distance-val">0 ft</span>
    </div>

    <!-- НАСТРОЙКИ ТОКЕНА (КОНТЕКСТНОЕ МЕНЮ С ПРОКРУТКОЙ ПРИ НЕОБХОДИМОСТИ) -->
    <div id="token-menu" class="token-context-menu" onmousedown="event.stopPropagation()">
        <div id="permissions-container-block" class="dm-only">
            <label style="color:#38bdf8; font-weight:bold; margin-bottom: 2px;">Контролируется:</label>
            <select id="ctx-owner-select" onchange="applyContextChanges()"></select>
            <hr style="border:0; border-top:1px solid #3f3f46; margin: 4px 0;">
        </div>

        <label>Имя токена</label>
        <input type="text" id="ctx-name" oninput="applyContextChanges()">
        
        <div class="context-row">
            <div style="flex:1;">
                <label style="color:#ef4444;">HP</label>
                <div class="context-row"><input type="number" id="ctx-hp" class="no-spinner" oninput="applyContextChanges()" style="width:35px;">/ <input type="number" id="ctx-max-hp" class="no-spinner" oninput="applyContextChanges()" style="width:35px;"></div>
            </div>
            <div style="flex:1;">
                <label style="color:#bfa15f;">КЗ (AC)</label>
                <input type="text" id="ctx-ac" oninput="applyContextChanges()">
            </div>
            <div style="flex:1;">
                <label style="color:#3b82f6;">Мана (MP)</label>
                <div class="context-row"><input type="number" id="ctx-mp" class="no-spinner" oninput="applyContextChanges()" style="width:35px;">/ <input type="number" id="ctx-max-mp" class="no-spinner" oninput="applyContextChanges()" style="width:35px;"></div>
            </div>
        </div>

        <div class="context-row" style="margin-top: 4px;">
            <div style="flex:1;">
                <label style="color:#38bdf8;">Инициатива</label>
                <input type="number" id="ctx-initiative" placeholder="0" oninput="applyContextChanges()">
            </div>
            <div style="flex:1;" class="dm-only">
                <label id="lbl-size">Размер (ft)</label>
                <input type="number" id="ctx-size" step="2.5" oninput="applyContextChanges()">
            </div>
        </div>

        <div class="context-row" style="margin-top: 4px;">
            <div style="flex:1;">
                <label style="color:#eab308;">Поворот (°)</label>
                <input type="number" id="ctx-rotation" value="0" step="15" oninput="applyContextChanges()">
            </div>
            <div style="flex:1;" class="dm-only">
                <label style="color:#a855f7;">Слой</label>
                <select id="ctx-layer" onchange="applyContextChanges()">
                    <option value="item">Предмет</option>
                    <option value="token">Токен</option>
                    <option value="gm">GM (Скрыто)</option>
                </select>
            </div>
        </div>

        <!-- Связка с другим токеном -->
        <div style="margin-top: 4px;">
            <label style="color:#eab308;">🔗 Привязать к тайлику:</label>
            <select id="ctx-parent-id" onchange="applyContextChanges()"></select>
        </div>

        <div class="dm-only" style="margin-top: 4px;">
            <label style="color:#22c55e; display:flex; align-items:center; gap:5px; cursor:pointer;">
                <input type="checkbox" id="ctx-show-hp" onchange="applyContextChanges()"> Показывать здоровье
            </label>
        </div>
        
        <label style="margin-top: 6px;">Состояния (клик для выборки)</label>
        <div class="status-toggle-grid">
            <span class="status-badge" data-status="dead" onclick="toggleStatusInCtx('dead')">💀</span>
            <span class="status-badge" data-status="poisoned" onclick="toggleStatusInCtx('poisoned')">🤢</span>
            <span class="status-badge" data-status="stunned" onclick="toggleStatusInCtx('stunned')">💫</span>
            <span class="status-badge" data-status="fire" onclick="toggleStatusInCtx('fire')">🔥</span>
            <span class="status-badge" data-status="freezed" onclick="toggleStatusInCtx('freezed')">❄️</span>
            <span class="status-badge" data-status="shocked" onclick="toggleStatusInCtx('shocked')">⚡</span>
            <span class="status-badge" data-status="shielded" onclick="toggleStatusInCtx('shielded')">🛡️</span>
            <span class="status-badge" data-status="invisible" onclick="toggleStatusInCtx('invisible')">👁️</span>
            <span class="status-badge" data-status="sleep" onclick="toggleStatusInCtx('sleep')">💤</span>
        </div>

        <label style="color:#22c55e; margin-top:4px;" id="lbl-auras">Ауры (Радиус ft)</label>
        <div class="context-row"><input type="number" id="aura1-rad" placeholder="0" oninput="applyContextChanges()"><input type="color" id="aura1-col" value="#ff0000" onchange="applyContextChanges()"></div>
        <div class="context-row"><input type="number" id="aura2-rad" placeholder="0" oninput="applyContextChanges()"><input type="color" id="aura2-col" value="#00ff00" onchange="applyContextChanges()"></div>
        <div class="context-row"><input type="number" id="aura3-rad" placeholder="0" oninput="applyContextChanges()"><input type="color" id="aura3-col" value="#0000ff" onchange="applyContextChanges()"></div>
        
        <button id="btn-delete-token" onclick="deleteSelectedTokens()" style="background:#ef4444; color:#fff; font-size:11px; margin-top:6px; width:100%;">❌ Удалить</button>
    </div>

    <div id="selection-box" class="selection-box"></div>

    <div id="game-viewport" class="mode-select">
        <div id="table-surface">
            <div id="map-container" class="active-layer-token">
                <canvas id="fog-canvas"></canvas>
                <canvas id="ruler-canvas"></canvas>
                <img id="game-map" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200" alt="Карта">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
